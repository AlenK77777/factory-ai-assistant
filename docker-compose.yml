services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Values come from .env (copy .env.example to .env first).
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Read-only role for the MCP server, created by db/init/02_readonly_role.sql.
      MCP_DB_USER: ${MCP_DB_USER:?Set MCP_DB_USER in .env}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?Set MCP_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Scripts here run only once, when the volume is empty (first start).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ passes a literal $ so the variable is read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/sh", "/etc/nginx/start.sh"]
    ports:
      # This computer only. Not the home network.
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/start.sh:/etc/nginx/start.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - ./logs/nginx:/var/log/nginx

volumes:
  db_data:
