name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.3"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -m "not integration"

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: No secrets or local files are tracked
        run: |
          tracked=$(git ls-files -- '.env' '.env.*' 'logs' 'logs/**' 'nginx/certs' 'nginx/certs/**' | grep -v -x '.env.example' || true)
          if [ -n "$tracked" ]; then
            echo "These paths must not be tracked by git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
