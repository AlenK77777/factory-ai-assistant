worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # One log line per request. The folder is mounted from the project (logs/nginx).
    access_log /var/log/nginx/access.log;

    client_max_body_size 1m;
    # About 20 chat questions a minute from one address, with a small burst.
    limit_req_zone $binary_remote_addr zone=chat_api:1m rate=20r/m;
    limit_req_status 429;

    # Long answers and re-indexing. Streaming progress must not sit in a buffer.
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    upstream chat {
        server host.docker.internal:7777;
    }

    server {
        listen 8080;
        server_name localhost;
        return 301 https://localhost:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

        # The employee chat is open. The admin page and its API are not.
        location = /admin {
            auth_basic "Factory admin";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
            proxy_pass http://chat;
        }

        location /api/settings {
            auth_basic "Factory admin";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
            proxy_buffering off;
            proxy_pass http://chat;
        }

        location /api/mcp/ {
            auth_basic "Factory admin";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
            proxy_pass http://chat;
        }

        location = /api/chat {
            limit_req zone=chat_api burst=5 nodelay;
            proxy_buffering off;
            proxy_pass http://chat;
        }

        # Shutdown stays on 127.0.0.1:7777 only.
        location = /api/shutdown {
            return 403;
        }

        location / {
            proxy_pass http://chat;
        }
    }
}
